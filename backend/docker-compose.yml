services:
  postgres:
    image: postgres:16-alpine
    container_name: agritrace-postgres
    environment:
      POSTGRES_DB: agritrace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agritrace_secret_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agritrace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: